# Runs the backtest notebook on a clean machine, using only the files in this repository.
name: Run notebook

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python -m nbconvert --to notebook --execute --ExecutePreprocessor.timeout=None --output-dir /tmp/executed magic_formula_backtests.ipynb
      - uses: actions/upload-artifact@v4
        with:
          name: magic_formula_backtests
          path: |
            /tmp/executed/
            results/
